version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cto-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cto_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_cto_secure_2024}
      POSTGRES_DB: ${POSTGRES_DB:-cto_tracker}
    ports:
      - "5432:5432"
    volumes:
      - cto_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: cto-tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cto_admin}:${POSTGRES_PASSWORD:-admin_cto_secure_2024}@db:5432/${POSTGRES_DB:-cto_tracker}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-esta_es_una_clave_secreta_para_nextauth_7_dias}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://algodon.instala.xyz/}
    volumes:
      - cto_uploads:/app/public/uploads # Volumen para persistir las imágenes subidas
    depends_on:
      - db

volumes:
  cto_pgdata:
    name: cto_pgdata
  cto_uploads:
    name: cto_uploads
